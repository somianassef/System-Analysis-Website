<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

 <header class="navbar">
    <div class="logo"><img src="normal-header.svg" alt=""></div>
    <nav class="nav-right">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <button id="back" class="cart-btn"><img src="add-to-cart.png" alt="" ></button>
    </nav>
  </header>

<main class="checkout-page">


  <!-- LEFT -->
  <section class="billing">

    <h2 class="section-title">Billing details</h2>

    <div class="two-cols">
      <div class="field">
        <label>First name <span>*</span></label>
        <input type="text" required>
      </div>

      <div class="field">
        <label>Last name <span>*</span></label>
        <input type="text" required>
      </div>
    </div>

    <div class="field">
      <label>Company name (optional)</label>
      <input type="text">
    </div>

    <div class="field">
      <label>Country / Region <span>*</span></label>
      <select required>
        <option>United States (US)</option>
      </select>
    </div>

    <div class="field">
      <label>Street address <span>*</span></label>
      <input type="text" placeholder="House number and street name" required>
      <input type="text" placeholder="Apartment, suite, unit, etc. (optional)">
    </div>

    <div class="two-cols">
      <div class="field">
        <label>Town / City <span>*</span></label>
        <input type="text" required>
      </div>

      <div class="field">
        <label>State <span>*</span></label>
        <input type="text" required>
      </div>
    </div>

    <div class="two-cols">
      <div class="field">
        <label>ZIP Code <span>*</span></label>
        <input type="text" required>
      </div>

      <div class="field">
        <label>Phone <span>*</span></label>
        <input type="text" required>
      </div>
    </div>

    <div class="field">
      <label>Email address <span>*</span></label>
      <input type="email" required>
    </div>

  </section>

  <!-- RIGHT -->
  <section class="order-summary">

    
    <div class="order-box">
        <h2 class="section-title">Your order</h2>

      <div class="cart-list"></div>

      <div class="payment-box">
        <label class="payment-option">
          <input type="radio" checked>
         Cash on delivery
        </label>
        <p class="payment-desc">
          Pay with cash upon delivery.
        </p>
      </div>

      <button class="place-order" id="placeOrder">Place order</button>
    </div>

  </section>

  

</main>


<section class="testimonials-section">
    <div class="dev"> <div class="flash"> <h1 weight="40px" >Ready to Find your Perfect Plant?</h1> </div>
  <div class="flash3"><h3 class="flash3">Browse our online store or visit us in person <br> to experience the beauty of nature.</h3> </div>
    <a href="#about" class="btn2">SHOP NOW</a></div>


    <div class="footer-section">

    <div class="footer-top">
        <div class="footer-logo">
            <img src="normal-header.svg" alt="Logo">
            
        </div>

        <ul class="footer-links">
            <li><a href="#">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="#">Warehouse</a></li>
            <li><a href="#">Accounting</a></li>
            
        </ul>

        <div class="social-icons">
            <i class="fab fa-facebook-f"></i>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-youtube"></i>
            <i class="fab fa-x-twitter"></i>
        </div>
    </div>

    <hr class="footer-line">

   

</div>

</section>


<script>
function getCart(){
  return JSON.parse(localStorage.getItem("cart")) || [];
}

function renderOrder(){
  const cart = getCart();
  const list = document.querySelector(".cart-list");

  let subtotal = 0;

  let html = `
    <div class="row head">
      <span>Product</span>
      <span>Subtotal</span>
    </div>
  `;

  cart.forEach(item=>{
    const total = item.price * item.qty;
    subtotal += total;

    html += `
      <div class="row">
        <span>${item.title} × ${item.qty}</span>
        <span>$${total.toFixed(2)}</span>
      </div>
    `;
  });

  html += `
    <div class="row">
      <strong>Subtotal</strong>
      <strong>$${subtotal.toFixed(2)}</strong>
    </div>

    <div class="row">
      <span>Shipping</span>
      <span>Free shipping</span>
    </div>

    <div class="row total">
      <strong>Total</strong>
      <strong>$${subtotal.toFixed(2)}</strong>
    </div>
  `;

  list.innerHTML = html;
}

renderOrder();


document.getElementById("placeOrder").onclick = function(){
  const inputs = document.querySelectorAll("input[required], select[required]");
  for(let input of inputs){
    if(!input.value.trim()){
      alert("من فضلك املي كل البيانات المطلوبة");
      input.focus();
      return;
    }
  }
  completeOrder();
};

function completeOrder(){
  localStorage.removeItem("cart");
  document.body.innerHTML = `
    <div style="max-width:600px;margin:100px auto;text-align:center;font-family:Arial">
      <h1>✅ Thank you. Your order has been received.</h1>
      <p>Your order has been placed successfully.</p>
      <a href="index.html" style="
        display:inline-block;margin-top:30px;padding:12px 30px;
        background:#7cc957;color:white;text-decoration:none;border-radius:30px;">
        Continue shopping
      </a>
    </div>
  `;
}
</script>

</body>
</html>
